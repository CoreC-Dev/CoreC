name: CI

# 触发条件：push 到 main 分支 或 提交 PR 时运行。
# docs-only 变更由 docs-gate.yml 单独把关（此前 paths-ignore 让纯文档 PR
# 一个 CI 都不跑——包括专门 lint 文档的 doc-gate job 本身）。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# H4 (quality audit 2026-10-21): rapid pushes stack full runs without this;
# the Dashboard workflow already does the same.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full gate sweep in ONE job: tests (race, short) already execute the
  # archtest/ and tastetest/ packages as part of ./... — the previous
  # separate `gates` job re-ran them (H4: tests ran 3× per CI run).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests + structure gates (race; archtest+tastetest run inside ./...)
        run: go test -race -short -timeout 120s ./...

      - name: Vet
        run: go vet ./...

      # Workflow-file validation (2026-10-21): the release.yml 'needs' bug —
      # a plain-scalar needs parsed as ONE invalid job id — made every push
      # since its introduction produce a phantom 0-job failure and would
      # have run NOTHING on a tagged release. YAML linters accept that
      # syntax; actionlint is the GitHub-workflow-aware validator. Both
      # repos' workflows are pinned clean by it; this step keeps them that
      # way (the same lesson as the golangci-lint single-sourcing in H1:
      # the gate that CI runs must run locally too — 'bash
      # scripts/download-actionlint.bash && ./actionlint').
      - name: Validate GitHub workflow files (actionlint)
        run: |
          bash <(curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

      - name: golangci-lint (pinned via Makefile — single source of truth)
        # H1 (quality audit 2026-10-21): the version lives in the Makefile
        # (GOLANGCI_VERSION) and `make lint` self-installs it, so local and
        # CI lint are mechanically identical. The prebuilt-binary caveat is
        # handled inside the Makefile target the same way (source build via
        # the ambient 1.27 toolchain from setup-go).
        run: make lint

  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # H4: aligned with the release.yml matrix — windows/arm64 and
      # linux/armv7 were SHIPPED but never build-checked.
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build check
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o /dev/null ./cmd/corec

  # Phase 3: Document gate (T9) — runs for code-path changes that might
  # break docs (endpoint edits, README claims). Docs-only changes are
  # covered by docs-gate.yml instead of being skipped entirely.
  doc-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Document lint (T9: dead links, required sections, orphans, package comments)"
        run: bash scripts/check-docs.sh

  # Phase 3: Coverage gate (T10). H4: calls the SAME script as
  # `make cover-gate` — per-package floors (core 95 / hub 90 / route 85 …)
  # previously enforced ONLY locally; CI checked a weaker overall ≥75%.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Coverage gate (per-package floors + overall ≥75%)
        run: bash scripts/check-coverage.sh
