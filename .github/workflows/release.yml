name: Release Multi-Arch

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -short -timeout 120s ./...

      - name: Vet
        run: go vet ./...

      - name: Modernization gate (go fix fixpoint)
        run: make fix-check

      - name: Lint + document gates
        run: make lint && bash scripts/check-docs.sh

  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Verify the built binary reports the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Git tag: v$TAG"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag '$TAG' is not valid semver (expected vX.Y.Z)"
            exit 1
          fi
          go build -ldflags "-X main.version=$TAG -X github.com/CoreC-Dev/CoreC/hub/route.Version=$TAG" -o /tmp/corec ./cmd/corec
          REPORTED="$(/tmp/corec -version)"
          echo "Binary reports: $REPORTED"
          if [[ "$REPORTED" != "$TAG" ]]; then
            echo "❌ Version mismatch: tag=$TAG binary=$REPORTED"
            exit 1
          fi
          echo "✅ Version consistency verified: tag=v$TAG, binary reports $REPORTED"

  build:
    needs: [test, version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
          # Linux ARM64
          - goos: linux
            goarch: arm64
          # Linux ARMv7
          - goos: linux
            goarch: arm
            goarm: "7"
          # macOS
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # Windows
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          if [ -n "${{ matrix.goarm }}" ]; then
            ARM_SUFFIX="-arm${{ matrix.goarm }}"
          else
            ARM_SUFFIX=""
          fi

          BINARY_NAME="corec-v${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${ARM_SUFFIX}"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi

          echo "Building $BINARY_NAME"

          go build \
            -ldflags="-s -w \
              -X main.version=${VERSION} \
              -X github.com/CoreC-Dev/CoreC/hub/route.Version=${VERSION}" \
            -o "dist/${BINARY_NAME}${EXT}" \
            ./cmd/corec

          cd dist
          cp ../config.example.yaml .
          cp ../README.md .

          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${BINARY_NAME}.zip" "${BINARY_NAME}${EXT}" config.example.yaml README.md
            rm -f "${BINARY_NAME}${EXT}"
          else
            tar -czf "${BINARY_NAME}.tar.gz" "${BINARY_NAME}${EXT}" config.example.yaml README.md
            rm -f "${BINARY_NAME}${EXT}"
          fi

          echo "ASSET_NAME=${BINARY_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          find artifacts -name "*.zip" -exec cp {} release/ \;

          cd release
          sha256sum ./*.tar.gz ./*.zip > checksums.txt
          echo "Release files:"
          ls -lh

      - name: Generate release body
        run: |
          mkdir -p release

          bash .github/scripts/changelog.sh "${GITHUB_REF_NAME}" 2>/dev/null > release/BODY.md

          echo "========== Final Release Body =========="
          cat release/BODY.md
          echo "========================================"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release/BODY.md
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/checksums.txt
