name: Docs Gate

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
  workflow_dispatch:

concurrency:
  group: docs-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Document lint
        run: bash scripts/check-docs.sh
