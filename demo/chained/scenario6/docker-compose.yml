# Scenario 6: One-to-Many Fanout
#
#                ┌──MQTT(cloud/...)──▶ subscriber
#   PLC ──▶ CoreC ┤
#   (mock)        └──HTTP──▶ http-sink
#
# One CoreC mirrors data to both MQTT and HTTP using action: mirror.
services:
  broker:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]

  mock-plc:
    build: { context: ../mock-plc }

  http-sink:
    build: { context: ../http-sink }
    ports: ["8080:8080"]

  corec:
    build:
      context: ../../..
      dockerfile: demo/chained/corec.Dockerfile
    volumes: ["./corec.yaml:/config.yaml:ro"]
    command: ["-config", "/config.yaml"]
    ports: ["9090:9090"]
    depends_on: [broker, mock-plc, http-sink]

  subscriber:
    image: eclipse-mosquitto:2
    command: ["sh", "-c", "sleep 3 && mosquitto_sub -h broker -t 'cloud/#' -v"]
    depends_on: [broker]
