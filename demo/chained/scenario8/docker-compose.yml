# Scenario 8: Auto-Discovery Two-Level Cascade
#
#   PLC ──modbus──▶ CoreC-A ──MQTT(auto)──▶ CoreC-B ──MQTT(cloud/...)──▶ subscriber
#   (mock-plc)      (collector)              (relay)                       (observe)
#
# This is identical to scenario2's topology, but uses auto-discovery:
#   - A omits topic-template → auto-generated "topo/edge-A/data/..."
#   - B omits data-topic → auto-discovered from A's heartbeat
#   - B omits parser → auto-set to default
#   - A omits rules → auto-added forward-all
#   - B explicitly sets topic-template "cloud/..." for the subscriber
#
# Compare with scenario2 to see how much config auto-discovery eliminates.
services:
  broker:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]

  mock-plc:
    build: { context: ../mock-plc }

  corec-a:
    build:
      context: ../../..
      dockerfile: demo/chained/corec.Dockerfile
    volumes: ["./corec-a.yaml:/config.yaml:ro"]
    command: ["-config", "/config.yaml"]
    ports: ["9090:9090"]
    depends_on: [broker, mock-plc]

  corec-b:
    build:
      context: ../../..
      dockerfile: demo/chained/corec.Dockerfile
    volumes: ["./corec-b.yaml:/config.yaml:ro"]
    command: ["-config", "/config.yaml"]
    ports: ["9091:9091"]
    depends_on: [broker]

  subscriber:
    image: eclipse-mosquitto:2
    command: ["sh", "-c", "sleep 3 && mosquitto_sub -h broker -t 'cloud/#' -v"]
    depends_on: [broker]
