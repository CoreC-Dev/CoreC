# Scenario 7: CoreC-B (relay — data uplink, command downlink from cloud)
# Subscribes edgeA/# for data uplink, forwards to cloud/...
# Listens on cloud/commands/# for commands; commands targeting drivers this
# node does not have are re-signed and forwarded to edgeA/commands/# (multi-hop
# command passthrough, see docs/guide/chained-core.md scenario 7).
global:
  log-level: info
  api:
    listen: 0.0.0.0:9091
    secret: "${COREC_API_SECRET}"

drivers: []

transports:
  - name: mqtt-chain
    type: mqtt
    settings:
      broker: tcp://broker:1883
      topic-template: "cloud/{{.Driver}}/{{.Tag}}"
      data-topic: "edgeA/#"
      command-topic: "cloud/commands/#"
      # Cloud→relay commands are signed with the cloud secret.
      command-secret: "${COREC_CLOUD_SECRET}"
      # Relay→edge forwards must be verifiable by CoreC-A: forward-secret
      # must equal A's command-secret.
      command-forward-topic: "edgeA/commands/#"
      command-forward-secret: "${COREC_COMMAND_SECRET}"
      parser: { type: default }

rules:
  - { name: forward-all, match: "ALL", action: forward, target: mqtt-chain }
