# Scenario 7: CoreC-A (edge — data uplink + command downlink)
# Polls PLC, publishes data to edgeA/..., listens for commands on edgeA/commands/#
global:
  log-level: info
  api:
    listen: 0.0.0.0:9090
    secret: "${COREC_API_SECRET}"

drivers:
  - name: plc
    type: modbus-tcp
    settings: { host: mock-plc, port: 502, slave-id: 1, timeout: 3s }
    tags:
      - { name: temperature, address: "40001", type: float32, group: sensors, interval: 1s }

transports:
  - name: mqtt
    type: mqtt
    settings:
      broker: tcp://broker:1883
      topic-template: "edgeA/{{.Driver}}/{{.Tag}}"
      command-topic: "edgeA/commands/#"
      # command-topic is fail-closed: commands must be HMAC-SHA256 signed
      # with this secret (see docker-compose.yml header for a signing recipe).
      command-secret: "${COREC_COMMAND_SECRET}"

rules:
  - { name: forward-all, match: "ALL", action: forward, target: mqtt }
