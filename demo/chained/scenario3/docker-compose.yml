# Scenario 3: Multi-hop Cascade (Edge → Gateway → Cloud)
#
#   PLC ──▶ CoreC-A ──MQTT──▶ CoreC-B ──HTTP──▶ CoreC-C ──MQTT──▶ subscriber
#   (mock)   (车间)            (厂区网关)         (区域中心)         (observe)
#
# Three hops: modbus→MQTT→HTTP→MQTT. Each hop can filter/transform.
services:
  broker:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]

  mock-plc:
    build: { context: ../mock-plc }

  corec-a:
    build:
      context: ../../..
      dockerfile: demo/chained/corec.Dockerfile
    volumes: ["./corec-a.yaml:/config.yaml:ro"]
    command: ["-config", "/config.yaml"]
    ports: ["9090:9090"]
    depends_on: [broker, mock-plc]

  corec-b:
    build:
      context: ../../..
      dockerfile: demo/chained/corec.Dockerfile
    volumes: ["./corec-b.yaml:/config.yaml:ro"]
    command: ["-config", "/config.yaml"]
    ports: ["9091:9091"]
    depends_on: [broker, corec-c]

  corec-c:
    build:
      context: ../../..
      dockerfile: demo/chained/corec.Dockerfile
    volumes: ["./corec-c.yaml:/config.yaml:ro"]
    command: ["-config", "/config.yaml"]
    ports: ["9092:9092"]
    depends_on: [broker]

  subscriber:
    image: eclipse-mosquitto:2
    command: ["sh", "-c", "sleep 4 && mosquitto_sub -h broker -t 'cloud/#' -v"]
    depends_on: [broker]
