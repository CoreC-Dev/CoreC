version: "2"
run:
  go: "1.27"
linters:
  enable:
    - bodyclose
    - gocritic
    - misspell
    - revive
  settings:
    gocritic:
      disabled-checks:
        - hugeParam
      enabled-tags:
        - performance
        - style
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
