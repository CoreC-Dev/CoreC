version: "2"
run:
  go: "1.27"
linters:
  # Default-enabled linters in golangci-lint v2 (always active unless disabled):
  #   errcheck, govet, ineffassign, staticcheck, unused
  # Notes on linters requested but not separate in v2:
  #   - gosimple:  merged into `staticcheck` (the S* checks), so enabling
  #                staticcheck already covers gosimple.
  #   - typecheck: built-in and always run by the Go analyzer; it is not a
  #                selectable linter in v2.
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nilnil
    - revive
    - staticcheck
    - unused
  settings:
    gocritic:
      disabled-checks:
        - hugeParam
      enabled-tags:
        - performance
        - style
    gocyclo:
      # Cyclomatic complexity threshold. Functions above this must be refactored
      # or explicitly excluded (e.g. cmd/corec main wiring).
      min-complexity: 20
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Unchecked errors in tests are common and rarely actionable.
      - linters:
          - errcheck
        path: _test\.go
      # The main entrypoint wires many subsystems together and is intentionally
      # linear/long; exclude it from cyclomatic complexity checks.
      - linters:
          - gocyclo
        path: cmd/corec/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
