version: "2"
run:
  go: "1.27"
linters:
  # Default-enabled linters in golangci-lint v2 (always active unless disabled):
  #   errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nilnil
    - revive
    - staticcheck
    - unused
  settings:
    gocritic:
      disabled-checks:
        - hugeParam
      enabled-tags:
        - performance
        - style
    gocyclo:
      # Functions above this must be refactored or explicitly excluded
      # (e.g. cmd/corec main wiring).
      min-complexity: 20
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - gocyclo
        path: cmd/corec/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
