# ============================================================
# Northbound Transports
# Supports: mqtt, http
#
# Chained Core: transports can also act as data *consumers* (inbound).
# Set "data-topic" (MQTT) or "webhook-addr" (HTTP) to receive data from
# upstream CoreC instances or third-party sources.  Incoming data is
# parsed and fed back into the engine's DataBus, flowing through rules
# and being re-published to downstream transports — enabling multi-hop
# relay topologies (edge → gateway → cloud).
# ============================================================
transports:
  ## 1. MQTT Cloud Transport (Publish + Command Writeback + Chained Inbound)
  - name: cloud-mqtt
    type: mqtt
    settings:
      broker: tcp://broker.emqx.io:1883
      client-id: factory-edge-01
      # username: "your-username"     # broker 认证用户名（可选，公共 broker 不需要）
      # password: ${MQTT_PASSWORD}     # broker 认证密码（可选，支持环境变量替换）
      ## --- TLS / mutual TLS (optional) ---
      ## Use a TLS scheme in the broker URL to enable encryption, e.g.:
      ##   broker: mqtts://broker.emqx.io:8883   # also: tls:// ssl:// mqtt+ssl:// tcps:// wss://
      ## Then optionally configure certificate files:
      ##   tls-ca-file:   CA certificate PEM for server verification.
      ##                  When omitted, the system root certificates are used.
      ##   tls-cert-file: client certificate PEM (enables mutual TLS / mTLS).
      ##   tls-key-file:  client private key PEM (must be set together with tls-cert-file).
      ## When no TLS scheme is used and no tls-* file is set, the connection
      ## stays plaintext (backward compatible).
      ## If TLS files are set but the broker scheme is plaintext (tcp://), Init
      ## returns an ERROR rather than silently sending credentials in plaintext.
      ## Use a TLS scheme (mqtts://, ssl://, ...) to actually enable TLS.
      # tls-ca-file: /etc/corec/certs/ca.crt
      # tls-cert-file: /etc/corec/certs/client.crt
      # tls-key-file: /etc/corec/certs/client.key
      qos: 1
      topic-template: "factory/{{.Driver}}/{{.Group}}/{{.Tag}}"
      # command-topic: "factory/commands/#"
      ## Command authentication (recommended for production): when set, command
      ## messages must carry hex(HMAC-SHA256(secret, payload)) in the
      ## "X-Signature" header or a "signature" JSON field. Empty = accept all
      ## commands (insecure, backward-compatible).
      # command-secret: "your-hmac-secret-here"
      ## --- Replay protection (optional, requires command-secret) ---
      ## When a command message includes a "timestamp" field (Unix milliseconds),
      ## the signature is verified over the payload (signature excluded, timestamp
      ## included) and the timestamp must fall within ±command-max-skew of the
      ## current time; otherwise the command is rejected as stale.
      ## A bounded replay cache (10,000 entries, auto-expiring after 2× the skew
      ## window) records the hash of each authenticated command, preventing true
      ## replay: the same message cannot be accepted twice within the window.
      ##   command-max-skew:     allowed timestamp drift (default 5m).
      ##   command-strict-replay: when true, authenticated commands WITHOUT a
      ##     timestamp are rejected outright. When false (default), they are
      ##     accepted with a warning for backward compatibility with senders
      ##     that predate timestamp enforcement.
      # command-max-skew: 5m
      # command-strict-replay: false
      ## --- Chained Core Command Passthrough (relay nodes) ---
      ## When a relay node receives a command via command-topic but has no
      ## local driver for the target, it forwards the command to downstream
      ## nodes via command-forward-topic. This enables multi-hop command
      ## relay: cloud → gateway → edge.
      ## When command-forward-secret is set, forwarded commands are signed
      ## with HMAC-SHA256 and include a fresh timestamp so downstream nodes
      ## can authenticate and replay-protect them. Empty = unsigned.
      # command-forward-topic: "downstream/commands"
      # command-forward-secret: ${COREC_FORWARD_SECRET}
      ## --- Chained Core Inbound ---
      ## Subscribe to data from upstream CoreC instances or third-party MQTT publishers.
      ## The parser converts each message body into a DataPoint.
      # data-topic: "upstream/factory/#"
      # parser:
        # type: default          # "default" = json.Unmarshal(DataPoint), for CoreC→CoreC
        # type: jsonpath       # for third-party JSON with different field names
        # driver: "lora-gateway"
        # tag: "{{ .payload.dev_id }}"
        # value: "{{ .payload.temp }}"
        # data-type: "float32"
        # group: "sensors"
        # timestamp: "{{ .payload.ts }}"
        # timestamp-format: "unix"
        # type: raw            # payload is the scalar value, tag from topic
        # driver: "factory"
        # tag-from-topic: 2    # use 2nd segment of MQTT topic as tag
        # data-type: "float32"
      ## MQTT operation timeouts (optional, defaults shown)
      # keep-alive: 60s
      # connect-timeout: 10s
      # publish-timeout: 5s
      # subscribe-timeout: 5s
      # disconnect-quiesce: 1s
      # connect-retry-interval: 5s   ## ±20% jitter applied at init to prevent thundering-herd
      ## Reconnect note: MQTT uses the paho client's built-in auto-reconnect
      ## (auto-reconnect + connect-retry, exponential backoff handled by paho).
      ## A ±20% jitter is applied to connect-retry-interval at init time to
      ## prevent thundering-herd when multiple transports reconnect after a
      ## broker outage. The circuit breaker that applies to DRIVERS does NOT apply
      ## to the MQTT transport.
    # buffer-size: 100           # command/data channel capacity (default 100)
    # batch-size: 50
    # flush-interval: 1s
    # fallback: mes-http-push     # fallback transport name (optional, used when this transport fails)

  ## 2. HTTP Webhook / REST Push (MES / Data Lake API + Chained Inbound)
  - name: mes-http-push
    type: http
    settings:
      url: "http://localhost:8080/api/v1/telemetry"
      method: POST
      # headers:
        # Authorization: "Bearer mes-secret-key"
      timeout: 3s
      ## --- Chained Core Inbound ---
      ## Start a webhook server to receive data from upstream CoreC instances
      ## or third-party HTTP POST sources.  Each POST body is parsed into
      ## DataPoint(s) and fed into the engine's DataBus.
      # webhook-addr: "0.0.0.0:9091"
      # webhook-path: "/ingest"
      ## Webhook authentication (recommended for production): when set, requests
      ## must carry "Authorization: Bearer <secret>" or "X-Webhook-Secret: <secret>".
      ## Empty = accept all requests (insecure, backward-compatible).
      # webhook-secret: "your-webhook-secret-here"
      ## --- Webhook TLS (optional) ---
      ## When both tls-cert-file and tls-key-file are set, the webhook server
      ## listens over HTTPS (ListenAndServeTLS) instead of plaintext HTTP.
      ## When either is empty the webhook stays plaintext (backward-compatible).
      ## A partial config (only one of the two set) logs a warning and falls
      ## back to plaintext rather than failing to start.
      # tls-cert-file: /etc/corec/certs/webhook.crt   # server certificate PEM
      # tls-key-file: /etc/corec/certs/webhook.key    # server private key PEM
      # parser:
        # type: default          # json.Unmarshal(DataPoint), for CoreC→CoreC
      ## HTTP connection pool (optional, defaults shown)
      # max-idle-conns: 100
      # max-idle-conns-per-host: 20
      # idle-conn-timeout: 90s
    # buffer-size: 100           # command/data channel capacity (default 100)
    # batch-size: 100
    # flush-interval: 5s

# ============================================================
# Rules
# Evaluated in priority order (lowest number = highest priority)
# Actions: forward, drop, alert, transform, mirror
#
# Match expression syntax:
#   field == 'value'        string equality
#   field != 'value'        string inequality
#   field =~ 'regex'        regex match (RE2)
#   field !~ 'regex'        regex non-match
#   field contains 'substr' substring containment
#   field suffix 'suffix'   suffix match
#   field prefix 'prefix'   prefix match
#   value > 90              numeric comparison (>, <, >=, <=)
#   value == true           boolean equality
#   value in 50..100        numeric range check (inclusive)
#   expr && expr            logical AND
#   expr || expr            logical OR
#   !expr                   logical NOT
#   (expr)                  grouping
#   ALL                     match all
#   RULE-SET:name           delegate to external rule provider
#   SUB-RULE:name           delegate to named sub-rule group
#
# Fields: driver, device, group, tag, quality, type, value
# ============================================================

# ── External Rule Providers (hot-reloadable) ──────────────────────
# rule-providers:
  # - name: safety-rules
    # type: file
    # path: ./rules/safety.yaml
    # interval: 30s          # auto-reload every 30s

# ── Sub-Rule Groups (named, reusable) ─────────────────────────────
# rule-groups:
  # high-priority-alert:
    # - name: bad-quality
      # match: "quality != 'good'"
      # action: alert
      # target: cloud-mqtt
    # - name: emergency-tag
      # match: "tag suffix 'emergency'"
      # action: alert
      # target: cloud-mqtt

rules:
  ## High Temperature Alert -> Forward immediately to Cloud MQTT
  - name: high-temp-alert
    match: "tag == 'temperature' && value > 95"
    action: alert
    target: cloud-mqtt
    priority: 1

  ## Emergency Stop -> High-priority Alert
  # - name: emergency-stop-alert
    # match: "tag == 'emergency_stop' && value == true"
    # action: alert
    # target: cloud-mqtt
    # priority: 2

  ## Reactor data with regex matching -> Mirror to both
  # - name: reactor-mirror
    # match: "tag =~ '^reactor_.*' && value in 50..200"
    # action: mirror
    # targets:
      # - cloud-mqtt
      # - mes-http-push
    # priority: 10

  ## Safety data via external rule provider
  # - name: use-safety-rules
    # match: "RULE-SET:safety-rules"
    # action: alert
    # target: cloud-mqtt
    # priority: 15

  ## Sub-rule group for high-priority alerts
  # - name: use-alert-group
    # match: "SUB-RULE:high-priority-alert"
    # action: alert
    # target: cloud-mqtt
    # priority: 20

  ## Motor data with suffix/contains matching
  # - name: motor-data
    # match: "tag contains 'motor' && driver prefix 'siemens'"
    # action: forward
    # target: mes-http-push
    # priority: 50

  ## Default rule: Forward all remaining points to MES HTTP Push
  - name: default-catch-all
    match: "ALL"
    action: forward
    target: mes-http-push
    priority: 999
