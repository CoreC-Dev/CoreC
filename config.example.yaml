# ============================================================
# CoreC Configuration Example
# IIoT Data Collection and Distribution Core
# ============================================================

# --- Environment Variable Substitution ---
# Any ${ENV_VAR} placeholder in the YAML (including tags-file contents)
# is replaced with the value of the matching environment variable before
# YAML parsing. This keeps secrets out of config files:
#
#   secret: ${COREC_API_SECRET}
#   password: ${MQTT_PASSWORD}
#   host: ${PLC_HOST}
#
# Rules:
#   - Variable names must match [A-Za-z_][A-Za-z0-9_]*.
#   - Unset variables are left as-is (the literal ${...} string survives),
#     making misconfigurations visible at startup.
#   - Substitution is byte-level (pre-YAML-parse), so type inference is
#     preserved: "port: ${PORT}" with PORT=502 parses as int, not string.
#   - Works inside quoted strings: topic: "topo/${NODE_ID}/data".

# --- Topology Auto-Discovery (optional) ---
# When node.id is set, the engine enables auto-discovery:
#   - topic-template, command-topic, parser auto-generated where omitted
#   - node broadcasts heartbeats so other instances can find it
#   - subscribe lists upstream nodes to auto-connect when they come online
# When omitted entirely, all auto-discovery is disabled (backward compatible).
# See docs/guide/chained-core.md → "拓扑自动发现" for details.
node:
  id: edge-A                    # unique node identifier
  role: collector               # collector | relay | aggregator | sink
  # subscribe: [upstream-1]     # upstream node IDs to receive from (relay/sink only)
  # topic-prefix: topo          # default "topo"; auto topics use {prefix}/{node-id}/data/...

global:
  log-level: info
  ## log-format: "text" (default, human-readable) or "json" (structured, for log aggregators like ELK/Loki)
  # log-format: json
  api:
    listen: 0.0.0.0:9090
    secret: ${COREC_API_SECRET}    # use env var; or "corec-secret-token" for local dev
    ## TLS (optional): uncomment to enable HTTPS
    # tls-cert: /path/to/cert.pem
    # tls-key: /path/to/key.pem
    ## CORS: empty = permissive default (Access-Control-Allow-Origin: *).
    ## List specific origins to restrict cross-origin access.
    # allowed-origins:
    #   - http://localhost:3000
    ## Rate limit (optional): max requests per second per IP
    # rate-limit-per-sec: 100
    ## HTTP server timeouts (optional, defaults shown)
    # read-header-timeout: 10s
    # read-timeout: 0        # 0 = disabled (no overall read deadline)
    # write-timeout: 0       # 0 = disabled (no overall write deadline)
    # idle-timeout: 120s
    ## Observability endpoints (all require authentication via api.secret):
    ##   GET /metrics         — Prometheus text-format metrics (scrape with Prometheus)
    ##   GET /debug/pprof/*   — pprof profiling endpoints (CPU, heap, goroutines)
    ##   GET /stats           — JSON statistics snapshot
    ##   GET /logs            — WebSocket log stream
    ##   GET /traffic         — WebSocket traffic stream
    ## pprof configuration:
    # pprof-disabled: false         # set true to disable pprof endpoints entirely
    # pprof-addr: "127.0.0.1:6060"  # optional: run pprof on a separate port (no auth)
    ## Request tracing: the API middleware parses the W3C `traceparent` header
    ## and propagates the trace ID through the request context for log
    ## correlation. Outbound HTTP push requests inject `traceparent` so the
    ## trace context spans service boundaries. Spans are created in the
    ## engine's readFromDriver step and logged at debug level via slog.
    ## No OTLP export backend is configured; spans are log-based only.

  ## Engine tuning (optional, defaults shown)
  engine:
    data-bus-size: 8192          # internal data bus channel capacity
    workers: 4                   # worker goroutines for processing
    shutdown-timeout: 30s        # graceful shutdown deadline
    error-throttle-window: 10s   # suppress repeated error logs within this window
    default-tag-interval: 1s     # fallback interval for tags without explicit interval
    # on-bad-quality: mark-and-publish  # bad quality policy: publish|drop|mark-and-publish|alert
    # stale-threshold: 30s              # mark cached values as is_stale if not updated within this duration
    # write-retry-count: 3              # write command retry count before entering dead letter queue

  ## Offline buffer (optional): persists failed publish batches to disk
  ## for replay after transport recovery. Enabled per-engine, applies to all
  ## transports with batch-size or flush-interval configured.
  # buffer:
    # enabled: true
    # path: /var/lib/corec/buffer  # buffer file directory (required when enabled=true)
    # max-size: 10000              # max buffered batches, evicts oldest when exceeded

# ============================================================
# Southbound Drivers
# Supports: modbus-tcp, modbus-rtu, modbus-rtuovertcp, modbus-udp, modbus-rtuoverudp, modbus-tls, s7, opcua
# ============================================================
drivers:
  ## 1. Modbus TCP Driver (PLC / Sensor Gateway)
  - name: plc-modbus
    type: modbus-tcp
    settings:
      host: 192.168.1.100
      port: 502
      slave-id: 1
      timeout: 3s
      retry: 3
      ## Reconnect backoff (optional, defaults shown)
      reconnect-interval: 2s
      reconnect-max-interval: 30s
      max-reconnect-failures: 20  # circuit breaker: after N consecutive failures, switch to 5-minute low-frequency retry
    ## tags-file: load tags from an external YAML file (useful for hundreds of points)
    ## tags-interval: hot-reload interval, e.g. "30s" (empty = load once, no auto-reload)
    # tags-file: ./tags/plc-modbus-tags.yaml
    # tags-interval: 30s
    tags:                      # inline tags (appended after file tags if both set)
      - name: temperature
        address: "40001"      # Holding register 0
        type: float32
        group: sensors
        interval: 1s
        deadband: 0.2
        read-timeout: 500ms   # per-tag read timeout (optional, default = interval)
      - name: pressure
        address: "40003"      # Holding register 2
        type: float32
        group: sensors
        interval: 1s
      - name: pump_status
        address: "00001"      # Coil 0
        type: bool
        group: actuators
        interval: 2s

